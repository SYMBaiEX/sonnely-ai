[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sonnely-sdk"
version = "0.1.2"
description = "Server-side Python client for the Sonnely inference API"
requires-python = ">=3.10"
readme = "README.md"

[project.urls]
Documentation = "https://docs.sonnely.com/docs/sdks"
Homepage = "https://sonnely.com"
