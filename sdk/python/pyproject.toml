[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sonnely-sdk"
version = "0.1.4"
description = "Server-side Python client for the Sonnely inference API"
requires-python = ">=3.11"
readme = "README.md"

[project.urls]
Documentation = "https://docs.sonnely.com/docs/sdks"
Homepage = "https://sonnely.com"
